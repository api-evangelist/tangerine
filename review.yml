actions:
  apisYmlUpdated: true
  openapiHarvested: false
  reason: |
    No first-party public API or downloadable specification exists to harvest.
    The repository is recorded as an identity-only (stub) profile with an honest
    aggregator-only data-access posture. It should be revisited if Tangerine
    launches a first-party developer portal or if Canada's Consumer-Driven
    Banking framework goes live and Tangerine exposes a compliant data API.
